server:
  port: 80
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://github.com/Gadiel-S
spring:
  application:
    name: api-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/condominios_gestao?useTimezone=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
logging:
  level:
    root: INFO
    # root: WARN
    # br.com.gadiel: DEBUG
